<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitch TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- bump ?v= when these files change: GitHub Pages lets browsers cache them for 10 minutes -->
  <link rel="stylesheet" href="style.css?v=2">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous"></script>
  <script src="https://sdk.titanos.tv/sdk/sdk.js"></script>
  <script src="config.js?v=2"></script>
  <script src="strings.js?v=2"></script>
</head>
<body>
  <div id="stage">
    <div id="backdrop"></div>
    <div id="scrim"></div>
    <div id="glow"></div>

    <section id="login" hidden>
      <div class="panel glass">
        <span class="brand"></span>
        <h1 id="login-title"></h1>
        <p id="login-hint" hidden></p>
        <div id="login-pair">
          <div id="login-qr"></div>
          <div id="login-code"></div>
        </div>
        <p id="login-status"></p>
      </div>
    </section>

    <section id="browse" hidden>
      <header class="enter" style="--i: 0">
        <span class="brand"></span>
        <span id="signout-hint"></span>
        <input id="search" class="search glass" type="text" autocomplete="off">
      </header>
      <div id="hero" class="enter" style="--i: 1">
        <h1 id="hero-name"></h1>
        <p id="hero-title"></p>
        <p id="hero-meta"></p>
      </div>
      <div id="viewport" class="enter" style="--i: 2"><div id="rows"></div></div>
    </section>

    <div id="exit" hidden>
      <div class="dialog glass">
        <p id="exit-title"></p>
        <div class="buttons">
          <button class="btn" data-action="stay"></button>
          <button class="btn" data-action="exit"></button>
        </div>
      </div>
    </div>
  </div>
  <!-- outside #stage on purpose: Twitch disables autoplay when the iframe sits under a CSS transform -->
  <section id="player" hidden>
    <iframe id="frame" allow="autoplay; fullscreen" tabindex="-1"></iframe>
  </section>
  <script src="app.js?v=2"></script>
</body>
</html>
